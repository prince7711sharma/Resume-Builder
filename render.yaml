services:
  - type: web
    name: resume-builder-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set this in the Render dashboard manually
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
