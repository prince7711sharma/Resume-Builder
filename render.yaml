services:
  - type: web
    name: resume-builder-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set this in the Render dashboard manually
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
